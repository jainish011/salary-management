services:
  postgres:
    image: postgres:16-alpine
    container_name: acme_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-acme_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-acme_pass}
      POSTGRES_DB: ${DB_NAME:-acme_salary}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-acme_user} -d ${DB_NAME:-acme_salary}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: acme_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-acme_redis_pass} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-acme_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
